# NOTE: This workflow was originally written for internal infrastructure and is
# retained here for reference only. It references a private Earthly base image
# (rios-ai/<internal_build_framework>), a private GitHub Actions repository
# (rios-ai/<internal_rios_github_actions>), and an internal Docker registry that are not
# available publicly. The workflow will not succeed without those resources.
#
# Community contributors wishing to set up CI should replace the Earthly targets
# with standard GitHub-hosted runners and public base images.

on:
  push:
    branches:
      - 'main'
      - 'develop'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  earthly_build_job:
    runs-on: ubuntu-latest
    name: Build Docker using Earthly

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Earthly Build Action
        id: build
        # NOTE: The Earthly target below depends on internal infrastructure.
        # Replace with a public equivalent to enable CI for this repository.
        run: |
          echo "Earthly build target requires internal infrastructure."
          echo "See docker/Earthfile and README.md for dependency details."
          exit 0
